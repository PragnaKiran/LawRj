name: Deploy Architecture Docs to GitHub Pages
on:
  push:
    branches:
      - main
    paths:
      - 'architecture-docs/src/docs/**'

permissions:
  contents: read
  pages: write
  id-token: write

jobs:
  build_and_deploy_gh_pages:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Setup AsciiDoctor
        run: sudo apt-get update && sudo apt-get install -y asciidoctor
      - name: Compile arc42 HTML
        run: asciidoctor architecture-docs/src/docs/asciidoc/index.adoc -o index.html
      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: '.'
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
