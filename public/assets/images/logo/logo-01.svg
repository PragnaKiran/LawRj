<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 300 80" width="300" height="80">
  <!-- Background -->
  <rect width="300" height="80" fill="#1a2b5e" rx="4"/>
  <!-- Scales of Justice Icon -->
  <g transform="translate(15, 12)" fill="#e8901a">
    <!-- Top beam -->
    <rect x="22" y="8" width="2" height="40" rx="1"/>
    <rect x="8" y="8" width="30" height="2.5" rx="1"/>
    <!-- Left pan chain -->
    <line x1="10" y1="10" x2="10" y2="30" stroke="#e8901a" stroke-width="1.5"/>
    <!-- Right pan chain -->
    <line x1="36" y1="10" x2="36" y2="30" stroke="#e8901a" stroke-width="1.5"/>
    <!-- Left pan -->
    <ellipse cx="10" cy="32" rx="9" ry="3.5" fill="none" stroke="#e8901a" stroke-width="1.5"/>
    <!-- Right pan -->
    <ellipse cx="36" cy="32" rx="9" ry="3.5" fill="none" stroke="#e8901a" stroke-width="1.5"/>
    <!-- Base -->
    <rect x="17" y="48" width="12" height="2.5" rx="1"/>
    <!-- Star at top -->
    <circle cx="23" cy="8" r="2.5" fill="#e8901a"/>
  </g>
  <!-- LawRj Text -->
  <text x="72" y="46" font-family="Georgia, serif" font-size="32" font-weight="700" fill="white" letter-spacing="1">LawRj</text>
  <!-- Consultancy subtext -->
  <text x="73" y="62" font-family="Arial, sans-serif" font-size="11" font-weight="400" fill="#e8901a" letter-spacing="3">CONSULTANCY</text>
  <!-- Divider -->
  <rect x="68" y="20" width="1.5" height="45" fill="#e8901a" opacity="0.6"/>
</svg>
